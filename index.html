<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Music Discovery</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span>Music Discovery</span>
      </div>

      <button id="theme-toggle" class="icon-button" type="button">
        ◐
      </button>
    </header>

    <main class="main-content">

      <section class="intro">
        <p class="eyebrow">DISCOVERY</p>
        <h1>Trouve quelque chose<br />qui mérite ton attention.</h1>
        <p class="intro-text">
          Une sélection musicale pensée comme un objet à parcourir,
          pas comme une playlist automatique.
        </p>
      </section>

      <section class="discovery-panel">

        <div class="panel-header">
          <div>
            <p class="eyebrow">SÉLECTION DU MOMENT</p>
            <h2 id="selection-title">À découvrir</h2>
          </div>

          <button id="refresh-button" class="secondary-button" type="button">
            Nouvelle sélection
          </button>
        </div>

        <div id="track-grid" class="track-grid">
          <!-- Les morceaux seront ajoutés par app.js -->
        </div>

      </section>

      <section id="track-detail" class="track-detail hidden">
        <button id="close-detail" class="close-button" type="button">
          Fermer
        </button>

        <div class="detail-content">
          <div id="detail-cover" class="detail-cover"></div>

          <div class="detail-info">
            <p id="detail-category" class="eyebrow"></p>
            <h2 id="detail-title"></h2>
            <p id="detail-artist"></p>
            <p id="detail-description"></p>

            <button id="play-button" class="primary-button" type="button">
              Écouter un extrait
            </button>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <span>Music Discovery</span>
      <span>Explorer autrement.</span>
    </footer>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
